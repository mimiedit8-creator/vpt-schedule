
name: ВПТ бот расписания

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "10 * * * *"
    - cron: "5/30 10-19 * * *"
    - cron: "0 */5 * * *"

  workflow_dispatch:
    inputs:
      job:
        description: "Что выполнить"
        required: true
        default: "send"
        type: choice
        options: [send, poll, watch, track, test]

jobs:
  send:
    if: github.event_name == 'schedule' && github.event.schedule == '0 17 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'send')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r vpt_bot_github/requirements.txt

      - name: Отправить расписание на завтра
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: python3 vpt_bot_github/vpt_bot.py send tomorrow

      - name: Сохранить состояние
        run: |
          git config user.name "vpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json music_cache.json || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push || true

  watch:
    if: github.event_name == 'schedule' && github.event.schedule == '5/30 10-19 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'watch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r vpt_bot_github/requirements.txt

      - name: Проверить публикацию расписания
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: python3 vpt_bot_github/vpt_bot.py send tomorrow --only-published

      - name: Сохранить состояние
        run: |
          git config user.name "vpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json music_cache.json || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push || true

  track:
    if: github.event_name == 'schedule' && github.event.schedule == '0 */5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'track')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r vpt_bot_github/requirements.txt

      - name: Проверить посылки Яндекс Доставки
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: python3 vpt_bot_github/vpt_bot.py track

      - name: Сохранить состояние
        run: |
          git config user.name "vpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json music_cache.json || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push || true

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r vpt_bot_github/requirements.txt

      - name: Тестовое сообщение в Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: |
          python3 vpt_bot_github/vpt_bot.py musictest
          python3 vpt_bot_github/vpt_bot.py send tomorrow --force

  poll:
    if: github.event_name == 'schedule' && github.event.schedule == '10 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: poll
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r vpt_bot_github/requirements.txt

      - name: Слушать команды (~40 минут)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: python3 vpt_bot_github/vpt_bot.py poll --max-seconds 2400

      - name: Сохранить состояние
        run: |
          git config user.name "vpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json music_cache.json || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push || true
