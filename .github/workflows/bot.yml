name: RKL-3 bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: vpt-schedule-main-push
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: vpt_bot_github
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot tasks
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python vpt_bot.py poll --once
          python vpt_bot.py auto
          python vpt_bot.py track

      - name: Save state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update bot state"

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected, resolving with ours..."
              git checkout --ours . || true
              git add -A
              git rebase --continue || git rebase --abort
            fi

            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after 6 attempts."
          exit 1
