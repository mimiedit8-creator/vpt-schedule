name: RKL-3 bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: rkl3-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: vpt_bot_github
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run bot tasks
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python vpt_bot.py poll --once
          python vpt_bot.py auto
          python vpt_bot.py track

      - name: Save state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update bot state"
          git pull --rebase --autostash origin main
          git push
