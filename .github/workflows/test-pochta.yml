name: test-pochta
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s --max-time 30 "https://www.pochta.ru/api/tracking/api/v1/trackings/by-barcodes?language=ru&track-numbers=RA123456789CN" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://www.pochta.ru/tracking" -w "\nHTTP %{http_code}\n" | head -c 800
